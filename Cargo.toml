[workspace]
members = [
    "serde_json_path",
    "serde_json_path_core",
    "serde_json_path_macros",
    "serde_json_path_macros/src/internal"
]
resolver = "2"

[workspace.dependencies]
# crates.io crates:
inventory = { version = "0.3.19" }
nom = "7.1.3"
proc-macro2 = "1.0.93"
quote = "1.0.38"
regex = { version="1.11.1" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
syn = { version = "2.0.97", features = ["full"] }
thiserror = "2.0.11"
tracing = { version = "0.1.40" }

# dev dependencies
test-log = { version = "0.2.17", default-features = false, features=["trace"] }
tracing-subscriber = { version = "0.3.18", default-features = false, features=["env-filter", "fmt"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "deny"
elided_lifetimes_in_paths = "allow"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
mem_forget = "warn"
unused_self = "warn"
filter_map_next = "warn"
needless_continue = "warn"
needless_borrow = "warn"
match_wildcard_for_single_variants = "warn"
if_let_mutex = "warn"
await_holding_lock = "warn"
imprecise_flops = "warn"
suboptimal_flops = "warn"
lossy_float_literal = "warn"
rest_pat_in_fully_bound_structs = "warn"
fn_params_excessive_bools = "warn"
exit = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
macro_use_imports = "warn"
option_option = "warn"
verbose_file_reads = "warn"
unnested_or_patterns = "warn"
str_to_string = "warn"
type_complexity = "allow"

[profile.dev]
incremental = false

[profile.release]
codegen-units = 1
